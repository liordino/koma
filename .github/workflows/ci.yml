---
name: ci
on:
  push:
    branches: [main, "plan/**"]
  pull_request:

# Least privilege: every job runs read-only against the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # tonic-build/prost-build need a protoc on PATH (not preinstalled on runners).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # koma-desktop (tauri) needs webkit2gtk/glib system libs on Linux; the shell is a
      # Windows desktop product gated by the local wave-22 launch check, not this job.
      - name: Build
        run: cargo build --workspace --exclude koma-desktop
      - name: Clippy
        run: cargo clippy --workspace --exclude koma-desktop --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --exclude koma-desktop
      # Compile-time query verification (decision 17). Prepared data lives in .sqlx/
      # once the first sqlx query! macro is used; gated so CI stays
      # green until then.
      - name: sqlx prepare check
        if: hashFiles('.sqlx/query-*.json') != ''
        run: |
          cargo install sqlx-cli --no-default-features --features sqlite
          cargo sqlx prepare --check --workspace

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          breaking: false
