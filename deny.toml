# cargo-deny configuration (decision 17: version pins + cargo-deny/Dependabot before slice 1).
# Template follows EmbarkStudios defaults, tightened for a homelab single-operator project.

[graph]
targets = [
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # Adopted deliberately on first CI license review (2026-11-24): the tauri stack
    # pulls MPL-2.0 (option-ext) and CDLA-Permissive-1.0 (unicode data). Both are
    # permissive for dependency use; recorded, not silently allowed.
    "MPL-2.0",
    "CDLA-Permissive-1.0",
    # webpki-roots (rustls CA bundle) embeds Mozilla root data under
    # CDLA-Permissive-2.0 — permissive data license, adopted deliberately.
    "CDLA-Permissive-2.0",
]
# Mihon/Apache-2.0 imports carry MIT + Apache-2.0 notices; everything allowed above preserves
# notices. New licenses surface as CI failures for an explicit decision, not silent adoption.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 (SQLite < 3.54 uninitialized page-cache via crafted db+wal
    # pair). Local attack vector; Koma never opens SQLite files written by a
    # less-trusted party (single-operator loopback service, .tachibk import is
    # protobuf, not SQLite). sqlx 0.8 pins libsqlite3-sys ^0.30 so the patched
    # 3.54 bundle is unreachable until sqlx ships it. Revisit on sqlx updates.
    "RUSTSEC-2026-0459",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
