# Koma compose — loopback shipped default (network baseline: reverse proxy + TLS
# is the only documented path for any wider exposure).
services:
  koma:
    build: .
    image: koma:local
    ports:
      - "127.0.0.1:8080:8080" # loopback only — the shipped default
    environment:
      KOMA_TOKEN: "${KOMA_TOKEN:?set KOMA_TOKEN in .env}"
      KOMA_ORIGINS: "http://127.0.0.1:8081"
    volumes:
      - koma-data:/data
  koma-web:
    image: nginx:alpine
    volumes:
      - ./docker/web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8081:80" # separate origin from the API (owner decision 2)
volumes:
  koma-data:
